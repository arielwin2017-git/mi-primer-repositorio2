<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Contador de calorías</title>
  </head>
  <body>
    <main>
      <h1>Contador de calorías</h1>
      <div class="container">
        <!-- El formulario envuelve correctamente todos los inputs y botones de acción -->
        <form id="calorie-counter">
          <!-- Acá van los pasos 2 a 11 -->
          <label for="budget">Presupuesto</label>
          <input 
            id="budget"
            type="number"
            min="0"
            placeholder="Presupuesto diario de calorías"
            required
          />

          <fieldset id="breakfast">
            <legend>Desayuno</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="lunch">
            <legend>Almuerzo</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="dinner">
            <legend>Cena</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="snacks">
            <legend>Meriendas</legend>
            <div class="input-container"></div>
          </fieldset>
   
          <fieldset id="exercise">
            <legend>Ejercicio</legend>
            <div class="input-container"></div>
          </fieldset>

          <div class="controls">
            <span>
              <label for="entry-dropdown">Agregar comida o ejercicio:</label>
              <select id="entry-dropdown" name="options">
                <option value="breakfast" selected>Desayuno</option>
                <option value="lunch">Almuerzo</option>
                <option value="dinner">Cena</option>
                <option value="snacks">Meriendas</option>
                <option value="exercise">Ejercicio</option>
                <!-- Paso 10 -->
              </select>
              <button type="button" id="add-entry">Agregar entrada</button>
              <!-- Paso 9 -->
            </span>
          </div>

          <div>
            <button type="submit">Calcular calorías restantes</button>
            <button type="button" id="clear">Limpiar</button>
          </div>
        </form>
      </div> <!-- Aquí se cierra correctamente el .container -->

      <div id="output" class="output hide"></div>
    </main>
    <!-- Acá va el paso 13 -->
    <script src="./script.js"></script>
  </body>
</html>
